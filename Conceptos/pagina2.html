<html>
    <head>
        <title>pagina inicial basica</title>
    </head>
    <body>
         aqui va lo que se va a presentar
    </body>
</html>

<!--
    En este ejemplo, se muestra una estructura básica de una página HTML. 
    La etiqueta <html> define el inicio del documento HTML, mientras que la etiqueta <head> contiene información sobre la página, 
    como el título que se muestra en la pestaña del navegador. 
    La etiqueta <body> contiene el contenido visible de la página web.

    Es importante tener en cuenta que este es un ejemplo muy básico y se pueden agregar más elementos y estilos para mejorar la apariencia y funcionalidad de la página web.
