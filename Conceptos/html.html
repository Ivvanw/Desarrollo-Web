<html>
    <head>
        <title>Conceptos de HTML/Colores</title>
    </head>
    <body
         bgcolor="gray" text="white">
         <h1>Conceptos de HTML</h1>
         <p>Este es un párrafo de ejemplo.</p>
    </body>
</html>

<!--
    En este ejemplo, se utiliza la etiqueta <body> para definir el color de fondo de la página web (bgcolor) y el color del texto (text). 
    El color de fondo se establece en gris y el color del texto en blanco. 
    Además, se incluye un encabezado <h1> y un párrafo <p> para mostrar contenido en la página.

    los atributos bg color y el atributo text son atributos obsoletos en HTML5. 
    Se recomienda utilizar CSS para definir estilos de color y otros estilos visuales en lugar de estos atributos.

    el texto "gray" y "white" se pueden cambiar por valores numericos de color en formato hexadecimal para obtener colores mas especificos.
    Por ejemplo, se puede usar "#808080" para gris y "#FFFFFF" para blanco.
