<html>
    <head>
         <title>Evolución de Sistemas Computacionales</title>
    </head>
    <body bgcolor="gray" text="white">

            <center><h2>Evolución de Sistemas Computacionales</h2></center>

            <table border="7" align="center">

             <tr>
                 <th
                    colspan="2"> Mainframe 
                </th>
             </tr>

             <tr>
                <th
                    colspan="2"> <img src="img/mainframe.jpg" width="100" height="70">
                </th>
             </tr>

             <tr>
                <td> Año 1960-1970 </td>
                <td> Donde la CPU aloja las 3 Capas </td>
             </tr>

             <tr>
                <th
                    colspan="2"> Terminales
                </th>
             </tr>

             <tr>
                <th
                    colspan="2"> <img src="img/terminales.png" width="100" height="70">
                </th>
             </tr>
             
             <tr>
                <td> Año 1970 </td>
                <td> Punto de acceso </td>
             </tr>
            
            </table>
    </body>
</html>

<!--
    En este ejemplo, se muestra las etiquetas que se utilizan para crear una tabla en HTML.
    La etiqueta <table> define el inicio de la tabla, mientras que la etiqueta <tr> define una fila de la tabla.
    La etiqueta <th> define una celda de encabezado, mientras que la etiqueta <td> define una celda de datos.
    Se utiliza el atributo "border" para definir el grosor del borde de la tabla y el atributo "align" para centrar la tabla en la página.
    Además, se incluyen imágenes utilizando la etiqueta <img> y se definen sus atributos "src", "width" y "height" para especificar la ruta de la imagen y su tamaño.
