<html>
    <head> 
        <title> Imagenes </title> 
    </head>
    <body bgcolor="black" text="silver">
        
        <h3> Imagenes de Gatos </h3>
        
        <marquee direction="right">
            <img src="img/gatoift.gif"> 
        </marquee>
        
        <center>
            <img src="img/gatoCentrado.jpg" width="250" height="250">
        </center>
        
        <br><br>
        
        <p>Camino relativo (dentro de carpeta):</p>
        <img src="img/gato1.jpg">
        <br>
        
        <p>Camino relativo (en la misma carpeta):</p>
        <img src="./img/gato2.jpg" width="100" height="150">

    </body>
</html>

<!--
    En este ejemplo, se muestran diferentes formas de incluir imágenes en una página web utilizando la etiqueta <img>. 
    Se utilizan atributos como "src" para especificar la ruta de la imagen, "width" y "height" para definir el tamaño de la imagen.
    Además, se utiliza la etiqueta <marquee> para crear un efecto de desplazamiento de la imagen y la etiqueta <center> para centrar una imagen en la página.
